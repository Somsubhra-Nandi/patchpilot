name: patchpilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patchpilot
      POSTGRES_USER: patchpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patchpilot-local}
    volumes:
      - patchpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchpilot -d patchpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://patchpilot:${POSTGRES_PASSWORD:-patchpilot-local}@postgres:5432/patchpilot
      FRONTEND_URL: http://localhost:3000
      AUTO_CREATE_SCHEMA: "false"
      SEED_DEMO_DATA: "true"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WRITE_ENABLED: ${GITHUB_WRITE_ENABLED:-false}
    # Hackathon/development execution configuration: Codex uses bubblewrap to
    # enforce its workspace sandbox; Docker's default
    # seccomp profile blocks the user-namespace syscall bubblewrap requires.
    security_opt:
      # This is required by the nested Codex sandbox setup. Codex sandbox
      # bypass is not enabled; do not treat this as production hardening.
      - seccomp=unconfined
    cap_add:
      - SYS_ADMIN
    ports:
      - "8000:8000"
    volumes:
      - patchpilot_workspaces:/workspaces
      - patchpilot_codex:/root/.codex
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  patchpilot_postgres:
  patchpilot_workspaces:
  patchpilot_codex:
